# Street types of Spain in Spanish, Catalan, Galician and Basque, with their usual abbreviations,
# mapped to a code common to every language. Built from the leading words of real street names in
# OSM and CartoCiudad. Words are folded: lowercase, without diacritics.
#
# - `words`: every way of writing the type, longest match wins ("poligono industrial").
# - `display`: one word per language, for the index-time variants of each name.
# - `generic`: never a street name on its own. Sources write it alone when the name is missing:
#   1,510 CartoCiudad portals of Baleares are on "CALLE" or "CAMINO". Others are names by
#   themselves: "La Rambla", "Ronda", "La Plaza", "El Paseo", "Diseminado".
# - `area`: names an area rather than a way (parks, gardens, estates, neighbourhoods…): a query
#   starting with one is as likely a place as an address ("Parc Güell").

# Streets of any type are also written as "calle".
any_type = "CL"

# Types that sources use for one another. CartoCiudad (ICGC data) writes "PASEO" for both
# "Passeig" and "Passatge": 1,910 streets in the province of Barcelona alone.
interchanged = [["PS", "PJ"]]

[[types]]
code = "CL"
words = ["calle", "calles", "carrer", "c", "cl", "cll", "rua", "kalea", "kale", "k"]
display = ["calle", "carrer", "rua", "kalea"]
generic = true

[[types]]
code = "AV"
words = ["avenida", "avinguda", "av", "avda", "avd", "avgda", "avnda", "etorbidea"]
