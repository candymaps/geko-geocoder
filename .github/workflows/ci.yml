# The checks of every pull request. On a pull request (or by hand), `changes` finds what it can break
# (ci/affected.sh): `check` runs the code and the contracts, and `golden` the golden of each country
# it can change, on its frozen data, with the instructions counted against the base branch on the
# same runner. Latencies and all of Spain are not checked here: they are only compared on one
# machine in one batch (`make test-regression`, local and on demand). `test` is the status that the
# protection of main and dev requires: it always runs, and passes when the checks passed or were not
# needed. pr-comment.yml says on the pull request which of the two it was. What reaches main, already
# checked, is published by publish.yml.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request supersedes its checks.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # What the pull request can break: the diff of its merge commit with the base branch (its first
  # parent). A run by hand checks everything, on the golden of every country.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.affected.outputs.code }}
      variants: ${{ steps.affected.outputs.variants }}
      countries: ${{ steps.affected.outputs.countries }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: affected
        run: |
          all=$(for d in countries/*/golden; do basename "$(dirname "$d")"; done | paste -sd, -)
          if [ "${{ github.event_name }}" = pull_request ]; then
            args=$(ci/affected.sh HEAD^1 HEAD)
          else
            args="--variant code,contracts,results,data,robustness,instructions --scope $all"
          fi
          variants=$(sed -n 's/.*--variant \([^ ]*\).*/\1/p' <<< "$args")
          scopes=$(sed -n 's/.*--scope \([^ ]*\).*/\1/p' <<< "$args")
          code=0
          [ -n "$variants" ] && code=1
          # What the golden checks: all but code and contracts, which `check` runs.
          golden=$(tr ',' '\n' <<< "$variants" | grep -vxE 'code|contracts' | paste -sd, - || true)
          [ -n "$golden" ] || scopes=
          {
            echo "code=$code"
            echo "variants=$golden"
            echo "countries=$(tr ',' '\n' <<< "$scopes" | jq -Rc '[inputs | select(length > 0)]' -n)"
          } >> "$GITHUB_OUTPUT"
          echo "ci/test.sh ${args:-(nothing)}"

  # The code and the contracts.
  check:
    needs: changes
    if: needs.changes.outputs.code == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The host (Cargo.toml: the SDK, and geko-app for the checks), while it is a private
      # repository that the token of this workflow cannot read: GEKO_HOST_TOKEN, with read access to
      # its contents. A pull request from a fork has no secrets, and reads it only once it is public.
      - env:
          HOST_TOKEN: ${{ secrets.GEKO_HOST_TOKEN }}
        if: env.HOST_TOKEN != ''
        run: git config --global url."https://x-access-token:$HOST_TOKEN@github.com/candymaps/geko.git".insteadOf https://github.com/candymaps/geko.git
      # The toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ci/test.sh --variant code,contracts

  # The golden of each country that `changes` lists, on the frozen data of
  # countries/<country>/golden/snapshot, with no tolerance: hits, data, sizes, robustness and
  # instructions (counted with the base branch too, on the same runner), as `changes` asks. The
  # snapshots are the packages ghcr.io/candymaps/geko-geocoder/countries/<country>/golden, read with the
  # token of the workflow. Without --include-performance: the latencies would be those of another
  # machine.
  golden:
    needs: changes
    if: needs.changes.outputs.countries != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        country: ${{ fromJSON(needs.changes.outputs.countries) }}
    env:
      GEKO_GOLDEN_DIR: ${{ github.workspace }}/.geko-golden
      GEKO_GOLDEN_PROFILE: ci
      GEKO_AB_DIR: ${{ github.workspace }}/.geko-ab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The instructions are compared with those of the base branch, where the pull request goes.
      - run: echo "GEKO_BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      - uses: oras-project/setup-oras@v1
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
      # A snapshot not published yet has nothing to compare with: publish it with
      # ci/golden-snapshot.sh publish.
      - run: |
          file=$(sed -n 's/^file=//p' "countries/${{ matrix.country }}/golden/snapshot")
          tag=${file#golden-}
          ref="ghcr.io/candymaps/geko-geocoder/countries/${{ matrix.country }}/golden:${tag%.tar.gz}"
          oras manifest fetch "$ref" > /dev/null || { echo "::error::$ref is not published"; exit 1; }
      - env:
          HOST_TOKEN: ${{ secrets.GEKO_HOST_TOKEN }}
        if: env.HOST_TOKEN != ''
        run: git config --global url."https://x-access-token:$HOST_TOKEN@github.com/candymaps/geko.git".insteadOf https://github.com/candymaps/geko.git
      - run: rustup toolchain install
      - run: sudo apt-get install -y valgrind
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .geko-golden/snapshots
          key: geko-golden-snapshot-${{ matrix.country }}-${{ hashFiles(format('countries/{0}/golden/snapshot', matrix.country)) }}
      - run: ci/test.sh --variant ${{ needs.changes.outputs.variants }} --scope ${{ matrix.country }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-reports-${{ matrix.country }}
          path: .geko-golden/reports

  # The status that the protection requires. A job that GitHub skips counts as passed, so this one
  # always runs and fails unless every check that was needed passed. It leaves its result in the
  # artifact `pr` for pr-comment.yml, which may write on the pull request (this run, from a fork,
  # may not).
  test:
    needs: [changes, check, golden]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - id: result
        run: |
          result=failure
          if [ "${{ needs.changes.result }}" = success ] \
            && [[ "${{ needs.check.result }}" =~ ^(success|skipped)$ ]] \
            && [[ "${{ needs.golden.result }}" =~ ^(success|skipped)$ ]]; then
            result=not-needed
            [ "${{ needs.changes.outputs.code }}" = 1 ] && result=passed
          fi
          echo "checks: $result"
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        run: |
          printf '{"number": %s, "head": "%s", "result": "%s"}\n' \
            "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.head.sha }}" "${{ steps.result.outputs.result }}" > pr.json
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: pr.json
          retention-days: 1
      - if: steps.result.outputs.result == 'failure'
        run: exit 1
