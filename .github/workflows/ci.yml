# The checks of every pull request, in two jobs side by side. On a pull request (or by hand), `test`
# finds whether it changes what the checks build (ci/affected.sh) and, if it does, runs the code and
# the contracts; `golden`, one job per country with a golden, runs it on its frozen data if the pull
# request can change that country, with the instructions counted against the base branch on the
# same runner, and passes at once if it cannot. Latencies and all of Spain are not checked here: they
# are only compared on one machine in one batch (`make test-regression`, local and on demand). `test`
# and every `golden (<country>)` are the statuses that the protection of main and dev requires: they
# always run, and pass when their checks passed or were not needed. A pull request from dev into
# main that takes dev as it is runs none: dev already passed them. pr-comment.yml says on the pull
# request which of the two it was. What reaches main, already checked, is published by publish.yml.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request supersedes its checks.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The checks are skipped step by step, never the job: a required job that GitHub skips counts as
  # passed. It leaves its result in the artifact `pr` for pr-comment.yml, which may write on the pull
  # request (this run, from a fork, may not).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # A pull request from dev (of this repository) into main whose merge is dev as it is: dev only
      # takes pull requests that passed these checks with the branch up to date, so its head already
      # passed them. If main has something dev lacks (a hotfix), the merge differs and they run.
      - id: release
        # Names that whoever opens the pull request chooses: never in the script itself.
        env:
          BASE: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          checked=0
          if [ "$BASE" = main ] && [ "$HEAD_BRANCH" = dev ] && [ "$HEAD_REPO" = "$REPO" ] \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            checked=1
          fi
          echo "checked=$checked" >> "$GITHUB_OUTPUT"
          echo "checked on dev $checked"
      # Every country with a golden has its job in the matrix of `golden`, which GitHub needs before
      # the job starts, and which the protection requires by name.
      - run: |
          want=$(for d in countries/*/golden; do basename "$(dirname "$d")"; done | paste -sd, -)
          have=$(sed -n 's/^ *country: \[\(.*\)\]$/\1/p' .github/workflows/ci.yml | tr -d ' ')
          [ "$want" = "$have" ] || { echo "::error::the matrix of golden is [$have], the countries with a golden are [$want]: add it there and to the protection of main and dev (golden (<country>))"; exit 1; }
      # Whether the pull request changes what the checks build: the diff of its merge commit with
      # the base branch (its first parent). A run by hand checks everything.
      - id: affected
        if: steps.release.outputs.checked == '0'
        run: |
          code=1
          if [ "${{ github.event_name }}" = pull_request ] && [ -z "$(ci/affected.sh HEAD^1 HEAD)" ]; then
            code=0
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code $code"
      # The host (Cargo.toml: the SDK, and geko-app for the checks), while it is a private
      # repository that the token of this workflow cannot read: GEKO_HOST_TOKEN, with read access to
      # its contents. A pull request from a fork has no secrets, and reads it only once it is public.
      - env:
          HOST_TOKEN: ${{ secrets.GEKO_HOST_TOKEN }}
        if: steps.affected.outputs.code == '1' && env.HOST_TOKEN != ''
        run: git config --global url."https://x-access-token:$HOST_TOKEN@github.com/candymaps/geko.git".insteadOf https://github.com/candymaps/geko.git
      # The toolchain pinned in rust-toolchain.toml.
      - if: steps.affected.outputs.code == '1'
        run: rustup toolchain install
      - if: steps.affected.outputs.code == '1'
        uses: Swatinem/rust-cache@v2
      - if: steps.affected.outputs.code == '1'
        run: ci/test.sh --variant code,contracts
      # What merging the pull request changes of the host it builds against, for pr-comment.yml to
      # warn of it, whether or not the checks ran: `contract` (the `sdk-<contract>` tag of the SDK in
      # Cargo.toml) and `sdk` (that dependency, in Cargo.toml or in what Cargo.lock locks).
      - id: warnings
        if: always() && github.event_name == 'pull_request'
        run: |
          pin() { git show "$1:Cargo.toml" | grep '^geko-module-sdk' || true; }
          locked() { git show "$1:Cargo.lock" | grep -A3 '^name = "geko-module-sdk"' | grep '^source' || true; }
          tag() { pin "$1" | sed -n 's/.*tag = "sdk-\([0-9]*\)".*/\1/p'; }
          warnings=
          [ "$(tag HEAD^1)" = "$(tag HEAD)" ] || warnings="$warnings contract"
          [ "$(pin HEAD^1)$(locked HEAD^1)" = "$(pin HEAD)$(locked HEAD)" ] || warnings="$warnings sdk"
          echo "warnings=${warnings# }" >> "$GITHUB_OUTPUT"
          echo "warnings: ${warnings:-none}"
      - if: always() && github.event_name == 'pull_request'
        run: |
          result=failure
          if [ "${{ job.status }}" = success ]; then
            result=not-needed
            [ "${{ steps.affected.outputs.code }}" = 1 ] && result=passed
            [ "${{ steps.release.outputs.checked }}" = 1 ] && result=checked-on-dev
          fi
          echo "checks: $result"
          printf '{"number": %s, "head": "%s", "result": "%s", "warnings": "%s"}\n' \
            "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.head.sha }}" "$result" "${{ steps.warnings.outputs.warnings }}" > pr.json
      - if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: pr.json
          retention-days: 1

  # The golden of the country, if the pull request can change it (ci/affected.sh), on the frozen data
  # of countries/<country>/golden/snapshot, with no tolerance: hits, data, sizes, robustness and
  # instructions (counted with the base branch too, on the same runner), as ci/affected.sh asks; a
  # run by hand checks all of it. The snapshots are the packages
  # ghcr.io/candymaps/geko-geocoder/countries/<country>/golden, read with the token of the workflow.
  # Without --include-performance: the latencies would be those of another machine. As in `test`,
  # the checks are skipped step by step, never the job.
  golden:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Every country with a golden, in order (`test` checks it).
        country: [es, lu]
    env:
      GEKO_GOLDEN_DIR: ${{ github.workspace }}/.geko-golden
      GEKO_GOLDEN_PROFILE: ci
      GEKO_AB_DIR: ${{ github.workspace }}/.geko-ab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # As in `test`: dev into main as it is, already checked.
      - id: release
        # Names that whoever opens the pull request chooses: never in the script itself.
        env:
          BASE: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          checked=0
          if [ "$BASE" = main ] && [ "$HEAD_BRANCH" = dev ] && [ "$HEAD_REPO" = "$REPO" ] \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            checked=1
          fi
          echo "checked=$checked" >> "$GITHUB_OUTPUT"
          echo "checked on dev $checked"
      - id: affected
        if: steps.release.outputs.checked == '0'
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            args=$(ci/affected.sh HEAD^1 HEAD)
          else
            args="--variant code,contracts,results,data,robustness,instructions --scope ${{ matrix.country }}"
          fi
          variants=$(sed -n 's/.*--variant \([^ ]*\).*/\1/p' <<< "$args")
          scopes=$(sed -n 's/.*--scope \([^ ]*\).*/\1/p' <<< "$args")
          # What the golden checks: all but code and contracts, which `test` runs.
          golden=$(tr ',' '\n' <<< "$variants" | grep -vxE 'code|contracts' | paste -sd, - || true)
          run=0
          if [ -n "$golden" ] && tr ',' '\n' <<< "$scopes" | grep -qx "${{ matrix.country }}"; then
            run=1
          fi
          {
            echo "run=$run"
            echo "variants=$golden"
          } >> "$GITHUB_OUTPUT"
          if [ "$run" = 1 ]; then echo "ci/test.sh --variant $golden --scope ${{ matrix.country }}"; else echo "not needed"; fi
      # The instructions are compared with those of the base branch, where the pull request goes.
      - if: steps.affected.outputs.run == '1'
        run: echo "GEKO_BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      - if: steps.affected.outputs.run == '1'
        uses: oras-project/setup-oras@v1
      - if: steps.affected.outputs.run == '1'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
      # A snapshot not published yet has nothing to compare with: publish it with
      # ci/golden-snapshot.sh publish.
      - if: steps.affected.outputs.run == '1'
        run: |
          file=$(sed -n 's/^file=//p' "countries/${{ matrix.country }}/golden/snapshot")
          tag=${file#golden-}
          ref="ghcr.io/candymaps/geko-geocoder/countries/${{ matrix.country }}/golden:${tag%.tar.gz}"
          oras manifest fetch "$ref" > /dev/null || { echo "::error::$ref is not published"; exit 1; }
      - env:
          HOST_TOKEN: ${{ secrets.GEKO_HOST_TOKEN }}
        if: steps.affected.outputs.run == '1' && env.HOST_TOKEN != ''
        run: git config --global url."https://x-access-token:$HOST_TOKEN@github.com/candymaps/geko.git".insteadOf https://github.com/candymaps/geko.git
      - if: steps.affected.outputs.run == '1'
        run: rustup toolchain install
      - if: steps.affected.outputs.run == '1'
        run: sudo apt-get install -y valgrind
      - if: steps.affected.outputs.run == '1'
        uses: Swatinem/rust-cache@v2
      - if: steps.affected.outputs.run == '1'
        uses: actions/cache@v4
        with:
          path: .geko-golden/snapshots
          key: geko-golden-snapshot-${{ matrix.country }}-${{ hashFiles(format('countries/{0}/golden/snapshot', matrix.country)) }}
      - if: steps.affected.outputs.run == '1'
        run: ci/test.sh --variant ${{ steps.affected.outputs.variants }} --scope ${{ matrix.country }}
      - if: always() && steps.affected.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: golden-reports-${{ matrix.country }}
          path: .geko-golden/reports
