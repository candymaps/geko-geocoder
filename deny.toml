# cargo-deny (ci/test.sh --variant code): licenses of the dependencies, security advisories and where
# crates come from. The licenses of the data sources are checked by the conformance suites.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
version = 2
# A transitive dependency no longer maintained (paste, through parquet) is not a vulnerability
# and is not ours to replace: only our direct dependencies must be maintained.
unmaintained = "workspace"

[licenses]
version = 2
# Permissive licenses only, so that geko can be served and distributed with no obligation beyond
# attribution. A copyleft license needs a decision first (BACKLOG 26).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
