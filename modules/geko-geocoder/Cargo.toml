[package]
name = "geko-module-geocoder"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The geocoder as a process module (`ProcessModule`); the host links the library in.
[[bin]]
name = "geko-geocoder"
path = "src/main.rs"

# The geocoder module (docs/MODULES_PLAN.md). Its providers are chosen here, by feature.
[features]
default = ["source-osm", "source-overture", "source-ogc-features", "geocode-fst", "reverse-rstar"]
geocode-fst = ["dep:geocode-fst"]
reverse-rstar = ["dep:reverse-rstar"]
source-osm = ["dep:source-osm"]
source-overture = ["dep:source-overture"]
source-ogc-features = ["dep:source-ogc-features"]

[dependencies]
geko-module-sdk.workspace = true
geko-core.workspace = true
geko-build.workspace = true
geko-fetch.workspace = true
geko-geom.workspace = true
geko-country-pack.workspace = true
source-osm = { workspace = true, optional = true }
source-overture = { workspace = true, optional = true }
source-ogc-features = { workspace = true, optional = true }
geocode-fst = { workspace = true, optional = true }
reverse-rstar = { workspace = true, optional = true }
arc-swap.workspace = true
clap.workspace = true
mimalloc = { version = "0.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
geko-module-sdk = { workspace = true, features = ["conformance"] }
tempfile = "3"

[build-dependencies]
sha2 = "0.10"
toml.workspace = true
