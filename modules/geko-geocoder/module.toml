# The package of the geocoder (docs/MODULES_PLAN.md): `make modules` puts it, with the executable
# and the library, in a directory of GEKO_MODULES, and ci/modules.sh publishes it, with its version,
# contract and platform. `kind = "dylib"`, with `entry = "libgeko_geocoder.so"`, loads it into the
# process of geko instead.
name = "geocoder"
kind = "process"
entry = "geko-geocoder"
