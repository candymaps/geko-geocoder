# The package of the geocoder (docs/MODULES_PLAN.md): the library that geko loads into its process
# (`DylibModule`, the only adapter), from the crate in dylib/. `make modules` puts it in a directory
# of GEKO_MODULES, and ci/modules.sh publishes it, with its version, contract and platform.
name = "geocoder"
kind = "dylib"
entry = "libgeko_geocoder.so"
