[workspace]
resolver = "3"
members = ["crates/*", "modules/*", "modules/geko-geocoder/dylib", "providers/*", "countries/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
geko-core = { path = "crates/geko-core" }
# The contract and what the host shares with its modules, from the repository of the host
# (docs/MODULES_PLAN.md): the commit of its tag sdk-<contract>. geko-app is the host itself, which
# geko-host links the geocoder into for the checks.
geko-module-sdk = { git = "https://github.com/candymaps/geko.git", rev = "bc474525521a9a9008cae2e406ab527d21d764c8" }
geko-fetch = { git = "https://github.com/candymaps/geko.git", rev = "bc474525521a9a9008cae2e406ab527d21d764c8" }
geko-artifact = { git = "https://github.com/candymaps/geko.git", rev = "bc474525521a9a9008cae2e406ab527d21d764c8" }
geko-app = { git = "https://github.com/candymaps/geko.git", rev = "bc474525521a9a9008cae2e406ab527d21d764c8" }
geko-build = { path = "crates/geko-build" }
geko-geom = { path = "crates/geko-geom" }
source-osm = { path = "providers/source-osm" }
source-overture = { path = "providers/source-overture" }
country-pack-es = { path = "countries/es" }
country-pack-lu = { path = "countries/lu" }
text-rules = { path = "providers/text-rules" }
geko-country-pack = { path = "crates/geko-country-pack" }
geocode-fst = { path = "providers/geocode-fst" }
geko-eval = { path = "crates/geko-eval" }
geko-conformance = { path = "crates/geko-conformance" }
reverse-rstar = { path = "providers/reverse-rstar" }
source-ogc-features = { path = "providers/source-ogc-features" }
geko-module-geocoder = { path = "modules/geko-geocoder" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = "0.1"
arc-swap = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
# Unwind, not abort: a bug in one request must never take the whole server down.
panic = "unwind"

# For checks of hit rates, not of latency: optimised like release, but much faster to compile.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
