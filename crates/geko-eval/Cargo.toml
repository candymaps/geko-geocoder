[package]
name = "geko-eval"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "geko-eval"
path = "src/main.rs"

[dependencies]
geko-core.workspace = true
geko-geom.workspace = true
geko-country-pack.workspace = true
text-rules.workspace = true
anyhow.workspace = true
arrow-array = "55"
